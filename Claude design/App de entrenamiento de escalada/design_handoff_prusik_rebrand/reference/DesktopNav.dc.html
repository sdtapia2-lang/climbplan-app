<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/organic-bc6d5372-5ebb-49bb-baea-00dab42e1673/styles.css">
  <script src="_ds/organic-bc6d5372-5ebb-49bb-baea-00dab42e1673/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;align-items:center;gap:28px;padding:14px 28px;background:var(--color-surface);border-bottom:1px solid var(--color-divider);font-family:var(--font-body);">
  <div style="display:flex;align-items:center;gap:10px;margin-right:8px;">
    <img src="assets/prusik-logo.png" alt="Logo Prusik" style="width:30px;height:30px;border-radius:10px;object-fit:cover;flex:none;"/>
    <span style="font-family:var(--font-heading);font-size:18px;color:var(--color-text);">Prusik</span>
  </div>
  <div style="display:flex;align-items:center;gap:4px;flex:1;flex-wrap:wrap;">
    <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="6">
      <span style="padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:{{ tab.weight }};color:{{ tab.color }};background:{{ tab.bg }};">{{ tab.label }}</span>
    </sc-for>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-size:11.5px;color:color-mix(in srgb, var(--color-text) 55%, transparent);">{{ roleLabelVal }}</span>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border-radius:999px;background:var(--color-bg);border:1px solid var(--color-divider);">
      <div style="width:24px;height:24px;border-radius:50%;background:var(--color-accent-300);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--color-accent-800);">{{ initial }}</div>
      <span style="font-size:13px;">{{ athleteNameVal }}</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:62},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;options&quot;:[&quot;Dashboard&quot;,&quot;Mesociclo&quot;,&quot;Planes&quot;,&quot;Formularios&quot;,&quot;Catálogo&quot;,&quot;Evaluación&quot;,&quot;Analítica&quot;,&quot;Perfil&quot;,&quot;Admin&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;athleteName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Seba&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;roleLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Administrador&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "Dashboard";
    const names = ["Dashboard", "Mesociclo", "Planes", "Formularios", "Catálogo", "Evaluación", "Analítica", "Perfil", "Admin"];
    const tabs = names.map((label) => ({
      label,
      weight: label === active ? 700 : 400,
      color: label === active ? "var(--color-accent-800)" : "var(--color-text)",
      bg: label === active ? "var(--color-accent-200)" : "transparent",
    }));
    const athleteNameVal = this.props.athleteName ?? "Seba";
    return {
      tabs,
      roleLabelVal: this.props.roleLabel ?? "Administrador",
      athleteNameVal,
      initial: athleteNameVal.slice(0, 1).toUpperCase(),
    };
  }
}

</script>
</body>
</html>
